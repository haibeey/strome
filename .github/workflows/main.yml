name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          clang++ -std=c++20 -Isrc -o /tmp/strome_url_test tests/url_util_test.cpp src/UrlUtil.cpp
          /tmp/strome_url_test

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cef_platform: macosx64
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-14
            cef_platform: macosarm64
            cmake_arch: arm64
    env:
      CEF_VERSION: "156.0.15+gcf671c0+chromium-156.0.8078.80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: cef/${{ matrix.cef_platform }}
          key: cef-${{ env.CEF_VERSION }}-${{ matrix.cef_platform }}

      - name: Download CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p cef
          url="https://cef-builds.spotifycdn.com/cef_binary_${CEF_VERSION}_${{ matrix.cef_platform }}.tar.bz2"
          echo "Downloading $url"
          curl -fL --retry 3 "$url" -o /tmp/cef.tar.bz2
          tar -xjf /tmp/cef.tar.bz2 -C /tmp
          mv "/tmp/cef_binary_${CEF_VERSION}_${{ matrix.cef_platform }}" "cef/${{ matrix.cef_platform }}"

      - name: Configure
        run: |
          cmake -B build -G Xcode \
            -DUSE_SANDBOX=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCEF_ROOT="${{ github.workspace }}/cef/${{ matrix.cef_platform }}"

      - name: Build
        run: cmake --build build --config Release --target strome
