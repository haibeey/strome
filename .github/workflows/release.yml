name: Release macOS DMG

on:
  push:
    tags:
      - "v0.0.1"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.0.1"
  CEF_VERSION: "156.0.15+gcf671c0+chromium-156.0.8078.80"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cef_platform: macosx64
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-15
            cef_platform: macosarm64
            cmake_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: cef/${{ matrix.cef_platform }}
          key: cef-${{ env.CEF_VERSION }}-${{ matrix.cef_platform }}

      - name: Download CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          brew install aria2
          mkdir -p cef
          url="https://cef-builds.spotifycdn.com/cef_binary_${CEF_VERSION}_${{ matrix.cef_platform }}.tar.bz2"
          echo "Downloading $url"
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --retry-wait=3 -m 3 -d /tmp -o cef.tar.bz2 "$url"
          tar -xjf /tmp/cef.tar.bz2 -C /tmp
          mv "/tmp/cef_binary_${CEF_VERSION}_${{ matrix.cef_platform }}" "cef/${{ matrix.cef_platform }}"

      - name: Configure
        run: |
          cmake -B build -G Xcode \
            -DUSE_SANDBOX=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCEF_ROOT="${{ github.workspace }}/cef/${{ matrix.cef_platform }}"

      - name: Build
        run: cmake --build build --config Release --target strome

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="build/src/Release/strome.app"
          STAGE="build/dmg-stage"
          DMG="strome-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/strome.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Strome" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strome-${{ env.APP_VERSION }}-macos-${{ matrix.arch }}
          path: ${{ env.DMG_PATH }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ${{ env.APP_VERSION }}
          generate_release_notes: true
          files: dist/*.dmg
